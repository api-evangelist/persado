name: Persado
description: 'Persado is an enterprise AI platform for regulated brands that generates,
  scores, and deploys compliant marketing and customer-communication language at scale,
  serving banking, credit cards, credit unions, fintech, insurance, and mortgage. Its
  products — Create, Optimize, and Automate — combine domain-specific language models
  with a multi-agent performance, brand, and compliance review, and deploy through
  native connectors for Salesforce Marketing Cloud, Adobe Campaign, Adobe Target, Braze,
  Responsys, and Optimizely. Persado runs a production remote Model Context Protocol
  server, the "Persado MCP Gateway", at https://api.persado.com/mcp, protected by OAuth
  2.1 with PKCE, dynamic client registration, and an mcp:tools scope issued by a Keycloak
  realm on myaccount.persado.com. That agent surface is undocumented — Persado publishes
  no developer portal, API reference, OpenAPI, or pricing — and was found by probing the
  API host directly. Persado also ships a first-party Enterprise API Mobile SDK for iOS
  and Android, though neither build is installable from a public package registry. This
  profile was surfaced as a portfolio company of bain-capital-ventures and enriched by
  the API Evangelist pipeline.'
