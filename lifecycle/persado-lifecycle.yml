source: >-
  https://www.persado.com/, https://api.persado.com/,
  https://persado.statuspage.io/, https://github.com/persado/eapi-mobile-sdk
notes: >-
  Persado publishes no versioning policy, no deprecation policy, no SLA and no
  status page. This is a recorded absence backed by probes, not an unchecked
  gap. The single most consequential item: the production MCP gateway at
  https://api.persado.com/mcp carries no version identifier anywhere in its
  public discovery surface, so an agent integrating against it has no way to
  detect a breaking change other than by calling it and failing.

versioning:
  scheme: none-published
  current: null
  docs: null
  note: >-
    The MCP gateway endpoint is unversioned (/mcp, no /v1). Neither the RFC 8414
    nor the RFC 9728 document carries a version, service-version or
    protocol-version field. The MCP protocolVersion would be returned by an
    initialize call, which is auth-gated.
  sdk_versioning:
    scheme: semver
    current: 0.4.0
    note: >-
      The Enterprise API Mobile SDK uses semver and is still pre-1.0. The
      published 0.4.0 has no matching git tag; the newest tag is v0.3.0.

deprecation:
  policy_url: null
  sunset_header: unknown
  deprecation_header: unknown
  note: >-
    No deprecation or sunset policy is published. RFC 8594 Sunset/Deprecation
    header support could not be observed because every API response available
    anonymously is a 401 or 404.

sla:
  url: null
  uptime_target: null
  note: >-
    No public SLA. Persado is sold on enterprise contracts; any availability
    commitment lives in the Master Service Agreement at
    https://www.persado.com/legal/terms-of-service rather than on a public SLA
    page.

