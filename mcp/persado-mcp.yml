generated: '2026-08-13'
method: probed
status: published
source: https://api.persado.com/.well-known/oauth-protected-resource
notes: >-
  Persado runs a live, production remote MCP server. It is not announced
  anywhere in Persado's marketing or documentation surface — the www.persado.com
  platform pages describe a "multi-agent" product but never mention MCP, and
  Persado publishes no developer portal. The server was found by probing the
  API host root: /.well-known/oauth-protected-resource returns an RFC 9728
  document that names the resource outright as
  "Persado MCP Gateway (Production)" at https://api.persado.com/mcp.
  POST /mcp with a tools/list request returns HTTP 401 with a
  WWW-Authenticate: Bearer resource_metadata=... challenge, which is the
  MCP-spec-correct 401. The tool list is therefore auth-gated and is NOT
  recorded here — no tools have been invented. Enumerating it would require a
  user credential in the persado-portal Keycloak realm, which this profile does
  not hold and will not obtain.

