apis:
- name: Persado MCP Gateway
  description: 'A production remote Model Context Protocol server operated by Persado
    at https://api.persado.com/mcp. Discovered by probing the API host: the RFC 9728
    protected-resource document names the resource verbatim as "Persado MCP Gateway
    (Production)". Access is gated by OAuth 2.1 — authorization code with mandatory
    S256 PKCE, public clients, RFC 7591 dynamic client registration at
    https://api.persado.com/register, and an mcp:tools scope issued by the persado-portal
    Keycloak realm. A tools/list call returns HTTP 401 with a spec-correct
    WWW-Authenticate resource_metadata challenge, so the tool inventory is auth-gated and
    is deliberately not recorded. Persado does not document this server anywhere public.'
  humanURL: https://www.persado.com/platform
  baseURL: https://api.persado.com/mcp
  tags:
  - MCP
  - Agents
  - Artificial Intelligence
  - Marketing
