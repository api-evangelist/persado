notes: >-
  Persado ships ONE first-party API client — the Enterprise API Mobile SDK,
  in iOS and Android builds — and neither build is installable from a public
  package registry. This is the headline finding of this artifact.
  Android: the demo app resolves
  com.persado.enterprise.apiclient:mobilesdk-android:0.4.0 from a private
  GitHub Packages Maven repository that requires a username and token
  (settings.gradle.kts declares mavenUser/mavenToken credentials). A HEAD on
  that repository's maven-metadata.xml returns HTTP 401, so the artifact cannot
  be resolved by a developer who is not already a Persado customer.
  iOS: mobilesdk.podspec declares version 0.4.0 but sets
  :git => "Not Published" — the pod is not on the CocoaPods trunk (404) and the
  spec's own source field says so. It is consumed by vendoring the checked-in
  mobilesdk.xcframework from the GitHub repository.
  Currency: the podspec and the Android demo app both name 0.4.0, but the
  newest git tag in eapi-mobile-sdk is v0.3.0 and the repository's last commit
  is from February 2024 — the published 0.4.0 has no corresponding tag.
  No npm, PyPI, RubyGems, NuGet, crates.io, Packagist or Go module exists for
  Persado's API. There is no MCP client package either; the MCP gateway is a
  remote endpoint, not an installable server.

